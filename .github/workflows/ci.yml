name: Document Checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check skills and public files
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          python -m unittest discover -s tests -v
